name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Extract Project Files
        run: |
          if [ -f "setup_project.py" ]; then
            python3 setup_project.py
          fi

      - name: Configure Android & Fix Kotlin 2.2.20 & AGP 9
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.architectengine.app
          fi

          # 1. Update Kotlin version to 2.2.20 in settings.gradle / settings.gradle.kts
          for p in android/settings.gradle android/settings.gradle.kts; do
            if [ -f "$p" ]; then
              sed -i -E 's/id\("org.jetbrains.kotlin.android"\) version "[^"]+"/id("org.jetbrains.kotlin.android") version "2.2.20"/g' "$p"
              sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "2.2.20"/g' "$p"
            fi
          done

          # 2. Update ext.kotlin_version in build.gradle if present
          if [ -f "android/build.gradle" ]; then
            sed -i -E 's/ext\.kotlin_version = .*/ext.kotlin_version = "2.2.20"/g' android/build.gradle
          fi

          # 3. Disable AGP 9 newDsl & builtInKotlin
          touch android/gradle.properties
          grep -q "android.newDsl" android/gradle.properties || echo "android.newDsl=false" >> android/gradle.properties
          grep -q "android.builtInKotlin" android/gradle.properties || echo "android.builtInKotlin=false" >> android/gradle.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Run app regression tests
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/flutter-tests.log"
          if flutter test --reporter expanded test/project_provider_test.dart test/project_requirements_test.dart test/project_wizard_test.dart test/tools_navigation_test.dart test/automatic_floor_plan_test.dart test/floor_plan_cad_test.dart test/project_scenarios_test.dart test/space_planning_test.dart test/tower_plan_test.dart test/concept_zoning_test.dart test/enclosed_cad_test.dart test/warehouse_loading_test.dart test/healthcare_cad_test.dart test/retail_cad_test.dart test/dwelling_g1_test.dart test/school_cad_test.dart test/packhouse_cad_test.dart test/survey_corridor_test.dart test/mixed_retail_cad_test.dart test/cross_dock_cad_test.dart test/office_cad_test.dart test/dining_cad_test.dart test/stacked_retail_cad_test.dart test/cattle_shed_cad_test.dart test/assembly_cad_test.dart test/library_cad_test.dart test/badminton_cad_test.dart test/hostel_cad_test.dart test/greenhouse_cad_test.dart test/t_junction_cad_test.dart test/shared_core_cad_test.dart test/inpatient_ward_cad_test.dart test/longitudinal_profile_test.dart test/stormwater_cad_test.dart test/truck_sweep_test.dart test/paired_apartment_test.dart test/cross_junction_cad_test.dart test/corridor_section_test.dart test/corridor_earthwork_test.dart test/solar_farm_test.dart test/detention_basin_test.dart test/ev_hub_test.dart test/orchard_cad_test.dart test/switchback_ramp_test.dart test/teaching_lab_test.dart test/hotel_wing_test.dart test/culvert_cad_test.dart test/basketball_cad_test.dart test/rainwater_cad_test.dart test/lap_pool_cad_test.dart test/public_market_cad_test.dart test/open_drain_cad_test.dart test/bus_layby_cad_test.dart test/raised_bed_cad_test.dart test/amphitheatre_cad_test.dart test/park_loop_cad_test.dart test/windrow_yard_cad_test.dart test/gallery_panel_cad_test.dart test/angled_parking_cad_test.dart test/footbridge_cad_test.dart test/cold_rack_cad_test.dart test/twin_tank_cad_test.dart test/tennis_cad_test.dart test/memorial_niche_cad_test.dart 2>&1 | tee "$log"; then
            exit 0
          fi
          # Surface the failing assertion in the check annotation as well as the log.
          details=$(grep -E -A 7 -m 2 'EXCEPTION CAUGHT|\[E\]|Error:' "$log" | head -c 2400 || true)
          details=${details//'%'/'%25'}
          details=${details//$'\n'/'%0A'}
          details=${details//$'\r'/'%0D'}
          echo "::error title=Flutter regression failure::$details"
          exit 1

      - name: Build Android Release APK
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/flutter-apk.log"
          if flutter build apk --release --android-skip-build-dependency-validation 2>&1 | tee "$log"; then
            exit 0
          fi
          details=$(grep -E -A 6 -m 3 'Error:|What went wrong:|Execution failed for task' "$log" | head -c 2400 || true)
          details=${details//'%'/'%25'}
          details=${details//$'\n'/'%0A'}
          details=${details//$'\r'/'%0D'}
          echo "::error title=Flutter APK build failure::$details"
          exit 1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: architect-engine-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
