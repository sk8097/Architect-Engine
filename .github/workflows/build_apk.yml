name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Extract Project Files
        run: |
          if [ -f "setup_project.py" ]; then
            python3 setup_project.py
          fi

      - name: Configure Android & Fix Kotlin 2.2.20 & AGP 9
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.architectengine.app
          fi

          # 1. Update Kotlin version to 2.2.20 in settings.gradle / settings.gradle.kts
          for p in android/settings.gradle android/settings.gradle.kts; do
            if [ -f "$p" ]; then
              sed -i -E 's/id\("org.jetbrains.kotlin.android"\) version "[^"]+"/id("org.jetbrains.kotlin.android") version "2.2.20"/g' "$p"
              sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "2.2.20"/g' "$p"
            fi
          done

          # 2. Update ext.kotlin_version in build.gradle if present
          if [ -f "android/build.gradle" ]; then
            sed -i -E 's/ext\.kotlin_version = .*/ext.kotlin_version = "2.2.20"/g' android/build.gradle
          fi

          # 3. Disable AGP 9 newDsl & builtInKotlin
          touch android/gradle.properties
          grep -q "android.newDsl" android/gradle.properties || echo "android.newDsl=false" >> android/gradle.properties
          grep -q "android.builtInKotlin" android/gradle.properties || echo "android.builtInKotlin=false" >> android/gradle.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
      - name: Apply Script Fixes
        run: |
          if [ -f fix_and_update.py ]; then         python3 fix_and_update.py; fi

      - name: Build Release APK
        run: flutter build apk --release
 --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: architect-engine-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
