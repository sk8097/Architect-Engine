name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Extract Project Files
        run: |
          if [ -f "setup_project.py" ]; then
            python3 setup_project.py
          fi
          if [ ! -f "lib/main.dart" ]; then
            echo "Extracting complete project files from embedded archive..."
            python3 - << 'PYEOF'
          import base64, zipfile, io, os
          b64 = """"""
          z = zipfile.ZipFile(io.BytesIO(base64.b64decode(b64)))
          for info in z.infolist():
              p = info.filename
              if p.startswith("architect_engine/"):
                  p = p[len("architect_engine/"):]
              if not p or p.endswith("/"):
                  continue
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "wb") as out_f:
                  out_f.write(z.read(info))
          print("Extracted all files successfully!")
          PYEOF
          fi

      - name: Configure Android & Fix Kotlin Version
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.architectengine.app
          fi

          # Update Kotlin version to 1.9.24 in settings.gradle
          if [ -f "android/settings.gradle" ]; then
            if grep -q "org.jetbrains.kotlin.android" android/settings.gradle; then
              sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
              sed -i -E 's/id\("org.jetbrains.kotlin.android"\) version "[^"]+"/id("org.jetbrains.kotlin.android") version "1.9.24"/g' android/settings.gradle
            elif grep -q "plugins {" android/settings.gradle; then
              sed -i '/plugins {/a \    id "org.jetbrains.kotlin.android" version "1.9.24" apply false' android/settings.gradle
            fi
          fi

          if [ -f "android/settings.gradle.kts" ]; then
            if grep -q "org.jetbrains.kotlin.android" android/settings.gradle.kts; then
              sed -i -E 's/id\("org.jetbrains.kotlin.android"\) version "[^"]+"/id("org.jetbrains.kotlin.android") version "1.9.24"/g' android/settings.gradle.kts
              sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle.kts
            fi
          fi

          # Update Kotlin version in build.gradle
          if [ -f "android/build.gradle" ]; then
            if grep -q "ext.kotlin_version" android/build.gradle; then
              sed -i -E 's/ext\.kotlin_version = .*/ext.kotlin_version = "1.9.24"/g' android/build.gradle
            elif grep -q "buildscript {" android/build.gradle; then
              sed -i '/buildscript {/a \    ext.kotlin_version = "1.9.24"' android/build.gradle
            fi
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: architect-engine-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
