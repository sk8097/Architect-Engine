      - name: Auto-generate Android scaffolding
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name architect_engine --platforms=android --org com.architectengine
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK and Update Kotlin
        run: |
          sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle 2>/dev/null || true
          sed -i -E 's/id\("org.jetbrains.kotlin.android"\) version "[^"]+"/id("org.jetbrains.kotlin.android") version "1.9.24"/g' android/settings.gradle* 2>/dev/null || true
          sed -i -E 's/ext\.kotlin_version = .*/ext.kotlin_version = "1.9.24"/g' android/build.gradle 2>/dev/null || true
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: architect-engine-apk
          path: build/app/outputs/flutter-apk/app-release.apk
