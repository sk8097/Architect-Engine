name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto-generate Android files if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found. Generating scaffolding..."
            cp pubspec.yaml pubspec.yaml.bak
            flutter create . --platforms=android --org com.architectengine
            cp pubspec.yaml.bak pubspec.yaml
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: architect-engine-apk
          path: build/app/outputs/flutter-apk/app-release.apk
